    - applications
  resources:
    cpu_cores: 4
    ram_gb: 8
  max_instances: 10
  shutdown_after_idle_minutes: 60
  max_idle_instances: 2
  scratch_storage: /mnt
  auto_select: true
  cost_per_hour: 0.1900
  instance_type: Standard_D4alds_v7

